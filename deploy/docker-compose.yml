# Déploiement sur le NAS Synology (Container Manager > Projet)
# Images à importer avant : zoe-backend, zoe-frontend (et postgres si le NAS n'a pas accès à Docker Hub)
name: zoe

services:
  db:
    image: postgres:19-alpine
    container_name: zoe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: zoe
      POSTGRES_USER: zoe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zoe}
      TZ: Europe/Paris
    volumes:
      # PostgreSQL 18+ : monter /var/lib/postgresql (les données vont dans un sous-dossier par version)
      - ./data/pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoe -d zoe"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: zoe-backend:2.1.0
    container_name: zoe-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/zoe
      DB_USER: zoe
      DB_PASSWORD: ${DB_PASSWORD:-zoe}
      TZ: Europe/Paris
      JAVA_TOOL_OPTIONS: -Xmx256m
      # Comptes de connexion (définis dans .env)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD doit être défini dans .env}
      USER_USERNAME: ${USER_USERNAME:-utilisateur}
      USER_PASSWORD: ${USER_PASSWORD:-}

  frontend:
    image: zoe-frontend:2.1.0
    container_name: zoe-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8090}:80"
