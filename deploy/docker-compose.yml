# Déploiement sur le NAS Synology (Container Manager > Projet)
# Images tirées de GitHub Container Registry (docker login ghcr.io requis si elles sont privées, voir LISEZMOI.md).
# Solution de repli sans registre : importer les archives .tar.gz (./build-images.sh) et remplacer par zoe-backend:<version> / zoe-frontend:<version>.
name: zoe

services:
  db:
    image: postgres:19-alpine
    container_name: zoe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: zoe
      POSTGRES_USER: zoe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zoe}
      TZ: Europe/Paris
    volumes:
      # PostgreSQL 18+ : monter /var/lib/postgresql (les données vont dans un sous-dossier par version)
      - ./data/pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoe -d zoe"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/samuelgru/zoe-backend:2.3.0
    container_name: zoe-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/zoe
      DB_USER: zoe
      DB_PASSWORD: ${DB_PASSWORD:-zoe}
      TZ: Europe/Paris
      JAVA_TOOL_OPTIONS: -Xmx256m
      # Comptes de connexion (définis dans .env)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD doit être défini dans .env}
      USER_USERNAME: ${USER_USERNAME:-utilisateur}
      USER_PASSWORD: ${USER_PASSWORD:-}
      # Appareils connectés automatiquement en consultation (ex. 192.168.1.0/24), vide = désactivé
      LOCAL_NETWORK: ${LOCAL_NETWORK:-}
      ADMIN_SESSION_MINUTES: ${ADMIN_SESSION_MINUTES:-30}

  frontend:
    image: ghcr.io/samuelgru/zoe-frontend:2.3.0
    container_name: zoe-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8090}:80"
