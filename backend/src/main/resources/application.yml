spring:
  application:
    name: zoe-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zoe}
    username: ${DB_USER:zoe}
    password: ${DB_PASSWORD:zoe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Europe/Paris
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    time-zone: Europe/Paris

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

zoe:
  timezone: Europe/Paris
