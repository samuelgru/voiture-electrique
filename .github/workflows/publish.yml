name: Publish

# Publie les images sur GitHub Container Registry quand on pousse un tag de version (ex. v2.1.0)
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # Tests et build : la publication attend leur succès
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      images: non

  publish:
    name: Publier zoe-${{ matrix.service }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # metadata-action met le nom en minuscules, comme l'exige GHCR
          images: ghcr.io/${{ github.repository_owner }}/zoe-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
