name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Appelé par publish.yml : les images ne sont publiées que si ces vérifications passent
  workflow_call:
    inputs:
      images:
        description: "« non » pour ne pas reconstruire les images (publish.yml les construit lui-même)"
        type: string
        default: "oui"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Compilation et tests
        run: mvn -B verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build de production
        run: npx ng build --configuration production

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: inputs.images != 'non'
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} (linux/amd64, sans push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
